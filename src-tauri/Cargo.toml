[package]
name = "agent-snake"
version = "0.2.0"
description = "A terminal-style Snake game for coding-agent wait time"
authors = ["Agent Snake contributors"]
edition = "2021"

[lib]
name = "agent_snake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
