[package]
name = "agent-snake"
version = "0.4.0"
description = "A quiet Snake companion for coding-agent wait time"
authors = ["Snaky contributors"]
edition = "2021"

[lib]
name = "agent_snake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "process"] }
tauri-plugin-global-shortcut = "2"
